name: build-rules

# Builds the production rules generation from the 8 provider sources on a
# schedule, publishes it as an immutable GitHub Release asset, and lets the
# module pull it with `bin/update.sh cloud <url>`.
#
# Deployment: copy this file into a dedicated rules repository (for example
# <owner>/STR-ADBlocker-rules). The workflow uses the production tooling from
# the module repository (defaults: <owner>/STR-ADBlocker, branch master; set
# MODULE_REPO / MODULE_REF repository variables to override), or runs against
# the current repository when it already contains tools/.

on:
  workflow_dispatch:
    inputs:
      module_repo:
        description: Module repository (owner/name) that owns the production tooling
        required: false
        default: ""
      module_ref:
        description: Git ref of the module repository (branch or tag)
        required: false
        default: ""
      reason:
        description: Optional build reason
        required: false
        default: manual
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: rules-build
  cancel-in-progress: false

env:
  MODULE_REPO_DEFAULT: ${{ vars.MODULE_REPO }}
  MODULE_REF_DEFAULT: ${{ vars.MODULE_REF }}
  ENDPOINT_RAW_URL: ${{ vars.ENDPOINT_RAW_URL }}
  KEEP_RELEASES: ${{ vars.KEEP_RELEASES }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve module tooling source
        id: resolve
        run: |
          if [ -f tools/compile_policy.py ]; then
            echo "tooling=repo" >> "$GITHUB_OUTPUT"
          else
            repo="${MODULE_REPO_DEFAULT:-${{ github.repository_owner }}/STR-ADBlocker}"
            ref="${MODULE_REF_DEFAULT:-master}"
            echo "tooling=module" >> "$GITHUB_OUTPUT"
            echo "module_repo=$repo" >> "$GITHUB_OUTPUT"
            echo "module_ref=$ref" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout module tooling
        if: steps.resolve.outputs.tooling == 'module'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.resolve.outputs.module_repo }}
          ref: ${{ steps.resolve.outputs.module_ref }}
          path: module

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch normal-domain popularity list
        run: |
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 300 \
            "https://tranco-list.eu/top-1m.csv.zip" \
            -o "$RUNNER_TEMP/tranco-top-1m.zip"
          python - "$RUNNER_TEMP/tranco-top-1m.zip" "$RUNNER_TEMP/top-1m.csv" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              data = archive.read("top-1m.csv")
          open(sys.argv[2], "wb").write(data)
          PY

      - name: Build generation
        id: build
        working-directory: ${{ steps.resolve.outputs.tooling == 'module' && 'module' || '.' }}
        env:
          STR_GENERATION_SIGNING_KEY: ${{ secrets.STR_GENERATION_SIGNING_KEY }}
        run: |
          if [ "${{ steps.resolve.outputs.tooling }}" = "module" ]; then
            allowlist="$GITHUB_WORKSPACE/module/config/default-allowlist.txt"
          elif [ -f "$GITHUB_WORKSPACE/default-allowlist.txt" ]; then
            allowlist="$GITHUB_WORKSPACE/default-allowlist.txt"
          else
            allowlist="$GITHUB_WORKSPACE/config/default-allowlist.txt"
          fi
          test -s "$allowlist" || { echo "canonical allowlist is missing: $allowlist" >&2; exit 1; }
          if [ "${{ steps.resolve.outputs.tooling }}" = "module" ]; then
            families="$GITHUB_WORKSPACE/module/config/sensitive-families.txt"
          elif [ -f "$GITHUB_WORKSPACE/sensitive-families.txt" ]; then
            families="$GITHUB_WORKSPACE/sensitive-families.txt"
          else
            families="$GITHUB_WORKSPACE/config/sensitive-families.txt"
          fi
          test -s "$families" || { echo "sensitive family list is missing: $families" >&2; exit 1; }
          if [ "${{ steps.resolve.outputs.tooling }}" = "module" ]; then
            categories="$GITHUB_WORKSPACE/module/config/rule-categories.txt"
          elif [ -f "$GITHUB_WORKSPACE/rule-categories.txt" ]; then
            categories="$GITHUB_WORKSPACE/rule-categories.txt"
          else
            categories="$GITHUB_WORKSPACE/config/rule-categories.txt"
          fi
          test -s "$categories" || { echo "rule category list is missing: $categories" >&2; exit 1; }
          python tools/build_cloud_generation.py \
            --work "$RUNNER_TEMP/work" \
            --out "$RUNNER_TEMP/out" \
            --source hagezi-normal=https://codeberg.org/hagezi/mirror2/raw/branch/main/dns-blocklists/adblock/multi.txt \
            --source antiad-easylist=https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-easylist.txt \
            --source 1hosts-lite=https://raw.githubusercontent.com/badmojr/1Hosts/master/Lite/domains.txt \
            --source adguard-dns=https://filters.adtidy.org/extension/chromium/filters/15.txt \
            --source banad=https://raw.githubusercontent.com/damengzhu/banad/main/jiekouAD.txt \
            --source oisd-big=https://big.oisd.nl \
            --endpoint-raw-url "${ENDPOINT_RAW_URL:-https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.list}" \
            --allowlist "$allowlist" \
            --min-rules 200000 \
            --min-sources 1 \
            --sensitive-min-sources 2 \
            --sensitive-families "$families" \
            --category-rules "$categories" \
            --normal-domains "$RUNNER_TEMP/top-1m.csv" \
            --normal-domains-limit 100000 \
            --single-unknown-source 1hosts-lite
          python - "$RUNNER_TEMP/out/latest.json" <<'EOF' >> "$GITHUB_OUTPUT"
          import json, sys
          latest = json.load(open(sys.argv[1]))
          for key in ("token", "provider_sha256", "generation_format", "rules", "endpoints", "archive_sha256", "normal_domains_sha256", "quality_filter", "quality_normal_limit", "quality_single_unknown_sources"):
              print(f"{key}={latest.get(key, '')}")
          EOF

      - name: Test module compile chain
        working-directory: ${{ steps.resolve.outputs.tooling == 'module' && 'module' || '.' }}
        # The module test stack is unittest-based (pytest is not installed on
        # the runner and is no longer used by verify.yml), so run the same
        # compile/provenance subset directly instead of failing on `pytest`.
        run: |
          if [ ! -d tests ]; then
            echo "tests/ is not present in this repository; the compile chain is covered by the module repository pipeline"
            exit 0
          fi
          python -m unittest \
            tests.test_compile_policy \
            tests.test_compile_hosts \
            tests.test_compile_ip_feed \
            tests.test_cloud_generation \
            tests.test_compile_rules \
            tests.test_build_rules

      - name: Compare with previous release
        id: compare
        run: |
          set +e
          curl -fsSL --connect-timeout 15 --max-time 60 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" \
            -o "$RUNNER_TEMP/prev.json"
          curl_status=$?
          set -e
          if [ "$curl_status" -eq 0 ]; then
            prev_provider=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/prev.json')).get('provider_sha256',''))")
            prev_format=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/prev.json')).get('generation_format',1))")
            prev_normal=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/prev.json')).get('normal_domains_sha256',''))")
            prev_quality=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/prev.json')).get('quality_filter',''))")
            prev_limit=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/prev.json')).get('quality_normal_limit',0))")
            prev_sources=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/prev.json')).get('quality_single_unknown_sources',''))")
            if [ -n "$prev_provider" ] && [ "$prev_provider" = "${{ steps.build.outputs.provider_sha256 }}" ] && \
                [ "$prev_format" = "${{ steps.build.outputs.generation_format }}" ] && \
                [ "$prev_normal" = "${{ steps.build.outputs.normal_domains_sha256 }}" ] && \
                [ "$prev_quality" = "${{ steps.build.outputs.quality_filter }}" ] && \
                [ "$prev_limit" = "${{ steps.build.outputs.quality_normal_limit }}" ] && \
                [ "$prev_sources" = "${{ steps.build.outputs.quality_single_unknown_sources }}" ]; then
              echo "unchanged=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publish release
        if: steps.compare.outputs.unchanged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          token="${{ steps.build.outputs.token }}"
          notes="Ruleset $token
          - rules=${{ steps.build.outputs.rules }}
          - endpoints=${{ steps.build.outputs.endpoints }}
          - provider_sha256=${{ steps.build.outputs.provider_sha256 }}
          - archive_sha256=${{ steps.build.outputs.archive_sha256 }}"
          gh release create "rules-$token" \
            "$RUNNER_TEMP/out/generation.tar.gz" \
            "$RUNNER_TEMP/out/latest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ruleset $token" \
            --notes "$notes"
          keep="${KEEP_RELEASES:-10}"
          case "$keep" in ''|*[!0-9]*) keep=10 ;; esac
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | tail -n +$((keep + 1)) \
            | while read -r tag; do
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
              done

      # Best-effort prewarming of the immutable tag asset on China-region
      # mirrors. The always-current latest URL is intentionally NOT warmed
      # from the runner: it can lag the GitHub redirect right after
      # publishing, and repeated runner-side attempts were observed to fail
      # on every mirror while on-demand device fetches of latest have been
      # reliable (cors.isteed.cc 2/2 in bare-network testing). Failures never
      # fail the workflow.
      - name: Warm mirror caches
        if: steps.compare.outputs.unchanged != 'true'
        continue-on-error: true
        run: |
          tag="rules-${{ steps.build.outputs.token }}"
          release="https://github.com/$GITHUB_REPOSITORY/releases/download"
          for mirror in cors.isteed.cc gh.ddlc.top gh-proxy.com ghfast.top ghproxy.net; do
            url="https://$mirror/$release/$tag/generation.tar.gz"
            echo "warming $url"
            curl -fsSL --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 3 \
              -o /dev/null "$url" || echo "warm failed: $url"
          done
